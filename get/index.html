<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get DuaDoor</title>
<meta name="description" content="DuaDoor guards the apps you choose and asks you to make du'a before they open.">
<meta name="theme-color" content="#0A0E1A">
<link rel="canonical" href="https://duadoor.app/get">
<style>
  :root{--bg:#0A0E1A;--gold:#C9A84C;--text:#F2EEE3;--muted:#9AA0B4}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    background-image:radial-gradient(ellipse 90% 55% at 50% 0%,rgba(201,168,76,.13),transparent 70%)}
  main{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
  .logo{width:64px;height:64px;margin-bottom:28px}
  h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;font-size:34px;line-height:1.15;letter-spacing:-.2px}
  h1 span{color:var(--gold);display:block}
  p{color:var(--muted);font-size:17px;line-height:1.5;margin:16px 0 32px}
  .badge{display:inline-block;color:var(--gold);text-decoration:none;font-size:16px;font-weight:600;-webkit-tap-highlight-color:transparent}
  .badge img{display:block;height:56px;width:auto}
  small{display:block;margin-top:14px;color:var(--muted);font-size:13px;letter-spacing:.3px}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 32 32" role="img" aria-label="DuaDoor"><path d="M20 4a12 12 0 1 0 8 21A10 10 0 1 1 20 4z" fill="#C9A84C"/><path d="M24 9l1.2 2.6 2.8.3-2.1 1.9.6 2.8L24 15.2l-2.5 1.4.6-2.8-2.1-1.9 2.8-.3z" fill="#E6CB7C"/></svg>
  <h1>Pause. Make du'a. <span>Then scroll.</span></h1>
  <p>DuaDoor guards the apps you choose and asks you to make du'a before they open.</p>
  <a class="badge" href="https://apps.apple.com/app/id6807518234?pt=128799123&amp;ct=tt_bio&amp;mt=8"><img src="app-store-badge.svg" alt="Download on the App Store" width="168" height="56"></a>
  <small>iPhone only · iOS 17+</small>
</main>
</body>
</html>
